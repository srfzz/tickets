spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tickets_db
    username: tickets_user
    password: 1234567@
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/event-ticket-platform

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  logback:
    rollingpolicy:
      max-history: 4
      max-file-size: 10MB
      total-size-cap: 500MB
      clean-history-on-start: true